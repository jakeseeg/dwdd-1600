<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Tickets</title>
    <link rel="stylesheet" href="air.css">
</head>

<body>
    <header>
        <h1>Get Your Tickets</h1>
        <p>Fill out the form below to secure your tickets!</p>
    </header>
    <main>
        <form action="success.html" method="GET">
            <fieldset>
                <legend>Customer Information</legend>
                <label for="fname">First Name*:</label>
                <input type="text" id="fname" name="fname" required><br><br>

                <label for="lname">Last Name*:</label>
                <input type="text" id="lname" name="lname" required><br><br>

                <label for="email">Email*:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="address">Address*:</label>
                <input type="text" id="address" name="address" required><br><br>
            </fieldset>

            <fieldset>
                <legend>Merch Bar</legend>
                <label for="hat">
                    <input type="checkbox" id="hat" name="merch" value="hat">
                    Hat
                </label><br>
                <label for="shirt">
                    <input type="checkbox" id="shirt" name="merch" value="shirt">
                    Shirt
                </label><br>
                <label for="hoodie">
                    <input type="checkbox" id="hoodie" name="merch" value="hoodie">
                    Hoodie
                </label><br>
                <label for="socks">
                    <input type="checkbox" id="socks" name="merch" value="socks">
                    Socks
                </label><br>
                <label for="customize">
                    <input type="checkbox" id="customize" name="merch" value="customize">
                    Customize
                </label><br><br>

                <label for="custom-text">Enter customization details (optional):</label><br>
                <textarea id="custom-text" name="custom-text" rows="4" cols="50" placeholder="Enter your customization details here..."></textarea><br><br>
            </fieldset>

            <fieldset>
                <legend>Admission Type</legend>
                <label for="admission">Select Admission Type*:</label>
                <select id="admission" name="admission" required>
                    <option value="general-admission">General Admission</option>
                    <option value="premium-balcony">Premium Balcony</option>
                    <option value="vip">VIP</option>
                </select><br><br>
            </fieldset>

            <input type="submit" value="Order Ticket" class="order-ticket-btn">
        </form>
    </main>
    <footer>
        <p>&copy; 2025 | Jake Seegmiller &bull; <a href="mailto:email@gmail.com">Email Us</a> &bull; <a href="tel:6162218904">Call Us</a></p>
    </footer>
</body>

</html>
